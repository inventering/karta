<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventeringskarta</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-2: #1c222b;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .map-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card-2);
  }
  .map-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Inventeringskarta</h1>

  <div class="card">
    <div class="map-frame">
      <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1PzkrW_JIsKGP7ANDGQz_bLcETu8biSM&ehbc=2E312F&noprof=1" loading="lazy"></iframe>
    </div>
  </div>
</div>
</body>
</html>
